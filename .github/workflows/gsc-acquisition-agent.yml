##############################################################################
# Nuty Tales — GSC Customer Acquisition Agent
# Runs daily at 6:00 AM IST (00:30 UTC) via GitHub Actions free cron.
#
# What it does every morning:
#   • Reads last 7 days of GSC search analytics for nutytales.com
#   • Bucket A: Rewrites meta title/description for high-impression, low-CTR pages (pos 1-7)
#   • Bucket B: Injects FAQ schema on Page-2 URLs (pos 8-20) to push them to Page 1
#   • Bucket C: Creates new landing pages in Prisma DB for zero-click buyer-intent queries
#   • Sends a Telegram digest to owner (+91 9717161809 linked)
#
# Cost: ₹0 — uses GitHub Actions free tier (2,000 min/mo) + Gemini 3.8 Flash free tier
# Supports both GitHub Secrets and GitHub Variables seamlessly.
##############################################################################

name: GSC Customer Acquisition Agent

on:
  schedule:
    # 6:00 AM IST = 00:30 UTC
    - cron: '30 0 * * *'

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  gsc-acquisition:
    name: Run GSC Acquisition Agent
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL || vars.DIRECT_URL }}

      - name: Run GSC Acquisition Agent
        run: npx tsx scripts/gsc-acquisition-agent.ts
        env:
          # Google Search Console auth
          GSC_CLIENT_EMAIL: ${{ secrets.GSC_CLIENT_EMAIL || vars.GSC_CLIENT_EMAIL }}
          GSC_PRIVATE_KEY: ${{ secrets.GSC_PRIVATE_KEY || vars.GSC_PRIVATE_KEY }}

          # AI brain (free tier)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || vars.GEMINI_API_KEY }}

          # Database
          DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL || vars.DIRECT_URL }}

          # Internal API auth
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || vars.NEXT_PUBLIC_APP_URL }}
          GSC_AGENT_SECRET: ${{ secrets.GSC_AGENT_SECRET || vars.GSC_AGENT_SECRET }}

          # Owner notifications
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || vars.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}

          # Cache revalidation
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK || vars.VERCEL_DEPLOY_HOOK }}

      - name: Report success
        if: success()
        run: echo "✅ GSC Acquisition Agent completed successfully"

      - name: Report failure
        if: failure()
        run: echo "❌ GSC Acquisition Agent failed — check logs above"
